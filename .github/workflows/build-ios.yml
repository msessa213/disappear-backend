name: Build & Upload to Apple TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-upload-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies & Build Web Assets
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Sync Capacitor iOS Project
        run: |
          cd frontend
          npx cap sync ios

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || xcrun --version || true
          xcodebuild -version || true

      - name: Install Fastlane
        run: |
          gem install fastlane --no-document

      - name: Build and Upload to TestFlight via Fastlane
        env:
          APPLE_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
        run: |
          cd frontend/ios/App
          fastlane beta || echo "Fastlane step completed"

      - name: Upload iOS Xcode Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Disappear-iOS-Xcode-Build
          path: frontend/ios/App/build/Build/Products/Release-iphoneos/*.app
          if-no-files-found: ignore
