version: '3.8'

services:
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:///./disappear.db
    volumes:
      - ./backend:/app/backend
      - ./disappear.db:/app/disappear.db

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend-dev
